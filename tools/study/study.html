<section id="study" class="panel on">
<div class="wrap">
<div class="shero">
  <p class="eyebrow">회독으로 익히는 {{SUBJECT}}</p>
  <h1>세 번 읽으면,<br>용어가 저절로 외워져요</h1>
  <div class="lvl"><div class="lvtop"><b id="lvName">Lv.1 새싹</b><span id="lvXp">0 XP</span></div><div class="lvbar"><i id="lvFill"></i></div><div class="lvsub" id="lvSub"></div></div>
  <div class="rchips">
    <button class="rchip on" data-read="1"><b>1회독</b><span>큰그림</span><small>초등학생도 이해하게</small></button>
    <button class="rchip" data-read="2"><b>2회독</b><span>조금 자세히</span><small>왜, 어떻게</small></button>
    <button class="rchip" data-read="3"><b>3회독</b><span>자세히 + 시험</span><small>숫자, 규격, 기출</small></button>
  </div>
</div>
<div id="lessonList"></div>
<div id="lessonView" hidden></div>
</div>
</section>

<section id="dex" class="panel">
<div class="wrap" style="padding-top:40px">
  <h1 class="part" style="margin-top:0;border:0;padding:0;font-size:30px">용어 도감</h1>
  <p class="lead" style="margin-top:-4px">회독하면서 본 용어가 여기 쌓여요. 눌러 본 용어는 도감에 등록되고, 세 번 이상 본 용어엔 ★이 붙어요.</p>
  <div class="dexstat" id="dexStat"></div>
  <div class="row"><span class="cap">범위</span><span id="dexUnits"></span></div>
  <div class="row"><span class="cap">보기</span><button class="chip" id="dexExam">기출 용어만</button><input type="search" id="dexQ" placeholder="용어 찾기"></div>
  <div class="btnrow"><button class="btn primary" id="dexGame">용어 스피드 게임 시작</button><span class="muted" style="font-size:13.5px">설명을 보고 10초 안에 용어를 고르세요. 지금 보이는 범위에서 출제돼요.</span></div>
  <div id="dexGameBox"></div>
  <div class="dexgrid" id="dexGrid"></div>
</div>
</section>
