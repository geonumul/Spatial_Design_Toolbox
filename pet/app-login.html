<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>펫 프로그램 로그인 | TSG</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FFF6FA;color:#4A3F5C;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
header{background:rgba(255,246,250,.9)}
.hwrap{max-width:560px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.4px;color:#1B1B2F;text-decoration:none}
main{max-width:560px;margin:0 auto;padding:24px 16px 60px}
.card{background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(120,80,140,.12);padding:28px 22px;text-align:center}
.paw{font-size:42px;line-height:1;color:#FF7FA6}
h1{font-size:22px;font-weight:600;margin:10px 0 6px}
p{margin:0 0 14px;color:#7A6E8A;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 22px;border:0;border-radius:999px;background:#FF7FA6;color:#fff;font:600 15px inherit;font-family:inherit;text-decoration:none;cursor:pointer}
.btn[hidden]{display:none}
small{display:block;margin-top:14px;color:#9A8FA8;font-size:12.5px}
.acct{margin-left:auto}
</style>
</head>
<body>
<header><div class="hwrap"><a class="brand" href="../index.html">TSG</a></div></header>
<main>
  <div class="card">
    <div class="paw">♥</div>
    <h1 id="t">펫 프로그램 로그인</h1>
    <p id="m">위 로그인 버튼으로 구글 계정에 로그인하면 펫 프로그램으로 돌아가요.</p>
    <a class="btn" id="go" href="#" hidden>펫 프로그램 열기</a>
    <small id="s">브라우저가 "TSG 펫을 열까요?" 하고 물으면 열기를 눌러 주세요.</small>
  </div>
</main>
<script src="../assets/firebase-config.js"></script>
<script src="../assets/sync.js"></script>
<script src="../assets/access-config.js"></script>
<script src="../assets/access.js" data-gate="login"></script>
<script>
/* 펫 프로그램(1.3.0 이상)이 연 페이지: 로그인한 뒤 tsgpet://login 으로 로그인 정보를 넘긴다.
   state 는 프로그램이 만든 값이라 프로그램이 기억하는 것과 같을 때만 받아 준다. */
(function () {
  var q = new URLSearchParams(location.search), state = q.get('state') || '';
  var ok = /^[A-Za-z0-9_-]{16,64}$/.test(state);
  var $ = function (id) { return document.getElementById(id); };
  if (!ok) { $('t').textContent = '펫 프로그램에서 열어 주세요'; $('m').textContent = '이 페이지는 펫 프로그램의 "구글 계정으로 로그인" 버튼을 누르면 열려요.'; $('s').hidden = true; return; }
  var sent = false;
  function handoff(u) {
    var url = 'tsgpet://login?state=' + encodeURIComponent(state) + '&uid=' + encodeURIComponent(u.uid) + '&rt=' + encodeURIComponent(u.refreshToken || '');
    $('go').href = url; $('go').hidden = false;
    $('t').textContent = (u.displayName || '') + ' 님, 로그인했어요';
    $('m').textContent = '펫 프로그램으로 돌아가는 중이에요. 안 넘어가면 아래 버튼을 눌러 주세요.';
    if (!sent) { sent = true; location.href = url; }
  }
  if (window.SDT) SDT.onAuth(function (u) { if (u && u.refreshToken) handoff(u); });
})();
</script>
</body>
</html>
